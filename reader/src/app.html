<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<!-- Zoom disabled: the app has its own font-size control and pinch/double-tap
		     zoom gets in the way on a music stand. Safari honors this only when the app
		     is installed on the home screen (standalone mode). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<meta name="theme-color" content="#2f3e46" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Canzoniere" />
		<!-- Apply the saved theme before first paint so the dark theme never
		     flashes light on load. -->
		<script>
			try {
				var theme = localStorage.getItem('reader:theme');
				if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
