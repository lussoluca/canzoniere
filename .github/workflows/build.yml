name: Build Canzoniere PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build canzoniere PDF
      run: make build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build printer tool
      run: cd printer && go build -o printer .

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build reader app
      env:
        BASE_PATH: /canzoniere/app
      run: |
        cd reader
        npm ci
        npm run build

    - name: Prepare public directory
      run: |
        mkdir -p public/canzonieri
        cp canzoniere.pdf public/
        cp -r reader/build public/app

    - name: Build event songbooks
      run: |
        shopt -s nullglob
        for txt in canzonieri/*.txt; do
          name=$(basename "$txt" .txt)
          ./printer/printer \
            -input="$txt" \
            -output="public/canzonieri/${name}.pdf" \
            -songs=canzoni \
            -dedup-chorus
          echo "Built: ${name}.pdf"
        done

    - name: Generate index.html
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: python3 site/generate.py

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
